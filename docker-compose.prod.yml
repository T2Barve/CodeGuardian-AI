# ==============================================================================
# CodeGuardian AI — Production Docker Compose Orchestration Topology
# Tiered Defense-in-Depth Architecture, Resource Constraints & High Availability
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Data Tier: PostgreSQL 16 Relational Storage
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: codeguardian-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codeguardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeguardian_password}
      POSTGRES_DB: ${POSTGRES_DB:-codeguardian_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    shm_size: 256mb
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - backend-tier
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codeguardian} -d ${POSTGRES_DB:-codeguardian_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  # ----------------------------------------------------------------------------
  # Data Tier: Redis 7 In-Memory Queue & Cache
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: codeguardian-prod-redis
    restart: always
    command: >
      sh -c 'redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-codeguardian_redis_secret}"'
    volumes:
      - redis_prod_data:/data
    networks:
      - backend-tier
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-codeguardian_redis_secret}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ----------------------------------------------------------------------------
  # Application Tier: FastAPI Gateway & REST Engine
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: codeguardian-prod-backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-codeguardian}:${POSTGRES_PASSWORD:-codeguardian_password}@postgres:5432/${POSTGRES_DB:-codeguardian_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-codeguardian_redis_secret}@redis:6379/0
      - CHROMA_PERSIST_DIRECTORY=/app/data/chromadb
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-production_webhook_secret}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY:-}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-4}
    volumes:
      - chroma_prod_data:/app/data/chromadb
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend-tier
      - backend-tier
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  # ----------------------------------------------------------------------------
  # Worker Tier: Multi-Agent Review Worker Cluster
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-codeguardian}:${POSTGRES_PASSWORD:-codeguardian_password}@postgres:5432/${POSTGRES_DB:-codeguardian_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-codeguardian_redis_secret}@redis:6379/0
      - CHROMA_PERSIST_DIRECTORY=/app/data/chromadb
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-production_webhook_secret}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY:-}
    volumes:
      - chroma_prod_data:/app/data/chromadb
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - backend-tier
    healthcheck:
      test: ["CMD", "python", "/app/services/worker/healthcheck.py"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  # ----------------------------------------------------------------------------
  # Presentation & Gateway Tier: Nginx Web Server & Reverse Proxy
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: codeguardian-prod-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-tier
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M

# ------------------------------------------------------------------------------
# Network Tier: Defense-in-Depth Segmentation
# ------------------------------------------------------------------------------
networks:
  # Public DMZ / Web Facing Tier (Frontend <-> Backend)
  frontend-tier:
    driver: bridge

  # Private Internal Storage Tier (Backend <-> Worker <-> Postgres <-> Redis)
  backend-tier:
    driver: bridge
    internal: true

# ------------------------------------------------------------------------------
# Volume Tier: Persistent State
# ------------------------------------------------------------------------------
volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  chroma_prod_data:
    driver: local
