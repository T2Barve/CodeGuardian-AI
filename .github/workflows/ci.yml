name: CodeGuardian AI Production CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Backend Quality, Linting & Automated Test Battery
  # ============================================================================
  backend-ci:
    name: Backend Lint, Security & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'apps/backend/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/backend/requirements.txt
          pip install ruff pytest pytest-asyncio pytest-timeout

      - name: Code Quality & Static Linting (Ruff)
        run: |
          ruff check apps/backend/

      - name: Execute Full Test Battery (Unit + Integration)
        env:
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_minimum_32_bytes_length_1234
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          CHROMA_PERSIST_DIRECTORY: ./test_chroma
          LLM_PROVIDER: mock
          GITHUB_WEBHOOK_SECRET: test_webhook_secret
        run: |
          cd apps/backend
          pytest tests/unit/ tests/integration/ -v --durations=10

  # ============================================================================
  # Job 2: Frontend Compilation, TypeScript Verification & Production Build
  # ============================================================================
  frontend-ci:
    name: Frontend TypeScript & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd apps/frontend
          npm ci || npm install

      - name: Type Check & Production Vite Compilation
        run: |
          cd apps/frontend
          npm run build

  # ============================================================================
  # Job 3: Docker Compose & Infrastructure Topology Validation
  # ============================================================================
  docker-validation:
    name: Docker Topology & Compose Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Validate Development Compose Topology
        run: |
          docker compose -f docker-compose.yml config

      - name: Validate Production Compose Topology
        env:
          POSTGRES_USER: codeguardian
          POSTGRES_PASSWORD: dummy_prod_password_for_validation
          POSTGRES_DB: codeguardian_db
          REDIS_PASSWORD: dummy_prod_redis_password
          GITHUB_WEBHOOK_SECRET: dummy_prod_webhook_secret
        run: |
          docker compose -f docker-compose.prod.yml config

  # ============================================================================
  # Job 4: Multi-Stage Container Image Build Verification
  # ============================================================================
  docker-build-test:
    name: Multi-Stage Container Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-ci, frontend-ci, docker-validation]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: false
          tags: codeguardian-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Review Worker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/worker/Dockerfile
          push: false
          tags: codeguardian-worker:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: false
          tags: codeguardian-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
